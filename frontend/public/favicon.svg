<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">

  <!-- Navy background for browser tab -->
  <rect width="64" height="64" rx="10" fill="#0d1b2e"/>

  <!-- OUTER J — solid dark teal block -->
  <!-- Top horizontal bar -->
  <rect x="22" y="7" width="28" height="10" rx="3" fill="#1a6068"/>
  <!-- Vertical stem -->
  <rect x="38" y="7" width="12" height="38" rx="0" fill="#1a6068"/>
  <!-- Bottom curve of outer J (rounded bottom-left) -->
  <path d="M22 35 L22 47 Q22 57 32 57 Q42 57 42 47 L42 45" stroke="#1a6068" stroke-width="10" fill="none" stroke-linecap="butt"/>
  <!-- Fill the outer J bottom solid -->
  <path d="M22 35 L22 47 Q22 57 32 57 Q41 57 41 47 L41 35Z" fill="#1a6068"/>

  <!-- WHITE GAP — creates the double-J negative space -->
  <rect x="26" y="11" width="18" height="6" rx="2" fill="#0d1b2e"/>
  <rect x="30" y="11" width="10" height="30" rx="0" fill="#0d1b2e"/>
  <path d="M26 32 L26 46 Q26 53 33 53 Q38 53 38 46 L38 33Z" fill="#0d1b2e"/>

  <!-- INNER J — dark teal, sits inside the white gap -->
  <!-- Top bar of inner J -->
  <rect x="27" y="12" width="12" height="6" rx="2" fill="#1a6068"/>
  <!-- Stem of inner J -->
  <rect x="31" y="12" width="8" height="26" rx="0" fill="#1a6068"/>
  <!-- Bottom curve of inner J -->
  <path d="M27 34 L27 44 Q27 51 33 51 Q37 51 37 44 L37 38" stroke="#1a6068" stroke-width="6" fill="none" stroke-linecap="round"/>

  <!-- CIRCUIT LINES — exiting from the left of the inner J at mid height -->
  <!-- Hub node where lines branch (hollow teal circle) -->
  <circle cx="27" cy="32" r="2.5" fill="#0d1b2e" stroke="#1a6068" stroke-width="1.8"/>

  <!-- Upper circuit line → orange dot -->
  <line x1="27" y1="32" x2="10" y2="25" stroke="#1a6068" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="10" cy="25" r="3" fill="#f5821f"/>
  <circle cx="10" cy="25" r="1.2" fill="#0d1b2e"/>

  <!-- Lower circuit line → hollow teal dot -->
  <line x1="27" y1="32" x2="10" y2="38" stroke="#1a6068" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="10" cy="38" r="2.8" fill="#0d1b2e" stroke="#1a6068" stroke-width="1.8"/>

  <!-- ORANGE DOT — at the top-right corner of the inner J (circuit connection) -->
  <circle cx="39" cy="18" r="3.2" fill="#f5821f"/>

</svg>
